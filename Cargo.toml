[package]
name = "git-remote-codecommit"
description = "Unofficial AWS CodeCommit Git credential helper in Rust"
version = "1.3.3"
license = "Apache-2.0"
readme = "README.md"
edition = "2024"
homepage = "https://github.com/bartleboeuf/git-remote-codecommit"
repository = "https://github.com/bartleboeuf/git-remote-codecommit"
authors = ["Bart LEBOEUF"]
keywords = ["git", "aws", "codecommit", "git-remote-helper", "aws-sdk"]
categories = ["development-tools", "command-line-utilities"]
rust-version = "1.99.0"  # Specify minimum Rust version
exclude = ["tests/", "benches/", "examples/", ".github/"]

[dependencies]
aws-config = { version = "1.13.0", features = ["behavior-version-latest"] }
aws-credential-types = { version = "1.3.1", default-features = false }
hmac = "0.13.0"
sha2 = "0.11.1"
url = "2.5.8"
tokio = { version = "1.54.1", features = ["rt"], default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
opt-level = 3
panic = "abort"
debug = false
overflow-checks = false
incremental = false

# Development profile optimizations
[profile.dev]
opt-level = 0
debug = true
overflow-checks = true
incremental = true

# Speed up dev builds by reducing optimization on deps
[profile.dev.package."*"]
opt-level = 1
debug = false

[[bin]]
name = "git-remote-codecommit"
path = "src/main.rs"

# Add feature flags for optional functionality
[features]
default = []
# Kept for build.sh/CI compatibility. sha2 0.11 dropped the `asm` feature and
# autodetects SHA-NI / ARM SHA instructions at runtime, so this is a no-op.
fast-crypto = []
